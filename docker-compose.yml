services:
  backend-dev:
    profiles: ["dev"]
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./.env:/app/.env:ro
      - hf_cache:/root/.cache/huggingface
    # Uncomment below if you have an NVIDIA GPU with the container toolkit installed.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend-dev:8000
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    depends_on:
      - backend-dev

  backend-prod:
    profiles: ["prod"]
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - hf_cache:/root/.cache/huggingface
    # Uncomment below if you have an NVIDIA GPU with the container toolkit installed.
    deploy:
      resources:
        reservations:
         devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8080:80"
    depends_on:
      - backend-prod

volumes:
  hf_cache:
  frontend_node_modules:
